# V1.5
# ============================================================
# Kalshi BTC 15-Min Bot - Configuration
# Generated by the Config GUI
# ============================================================

# --- Authentication ---
# Kalshi requires a Key ID + RSA private key (NOT a plain token).
# Create both at https://kalshi.com/account/api  (or the demo site for testing)
kalshi:
  key_id: "YOUR_KEY_ID_HERE"
  private_key_path: "./kalshi_private_key.pem"

  # Use the demo environment first to prove the bot works before risking money.
  # IMPORTANT: demo is a SEPARATE paper-trading exchange with its own order
  # book - it does NOT mirror live production prices.
  #
  # demo:       https://external-api.demo.kalshi.co/trade-api/v2
  # production: https://external-api.kalshi.com/trade-api/v2
  base_url: https://external-api.kalshi.com/trade-api/v2

# --- Market ---
market:
  series_ticker: "KXBTC15M"

# --- Strategy ---
strategy:
  # "momentum" | "reversal" | "adaptive" | "price_trend" | "spot_lean" | "late_fade"
  mode: "spot_lean"

  # Only used when mode is "adaptive"
  adaptive_default_mode: "momentum"

  # --- Price-trend strategy settings (only used when mode: "price_trend") ---
  price_trend:
    lookback_cycles: 6
    threshold_pct: 0.15

  # --- Spot-lean strategy settings (only used when mode: "spot_lean") ---
  spot_lean:
    threshold_pct: 0.01
    poll_interval_sec: 1

  # --- Late-fade strategy settings (only used when mode: "late_fade") ---
  # Bets on a REVERSAL back toward this window's own target (floor_strike)
  # instead of following the current lean the way spot_lean does: if live
  # BTC spot is trading above target by more than threshold_pct, bets DOWN
  # (anticipating it reverts back toward the strike); if trading below,
  # bets UP. Uses the same entry_start_min/entry_end_min/min_price_cents/
  # max_price_cents fields below for its window and price range - no
  # separate ones of its own. One extra rule on top of those: if BOTH the
  # UP and DOWN price are already above max_price_cents right at
  # entry_start_min, the whole session is skipped outright instead of
  # being watched all the way to entry_end_min for a drop that isn't
  # expected to come.
  late_fade:
    threshold_pct: 0.01

  # --- Hedge: watches live BTC spot vs. this window's own target
  # (floor_strike) after ANY strategy's main bet is placed, and fires an
  # opposing bet if price crosses back against it. Independent of
  # strategy.mode - momentum, reversal, adaptive, price_trend, and
  # spot_lean are all just picking a side on the same floor_strike target,
  # so hedging works the same underneath all of them.
  hedge:
    enabled: false
    threshold_pct: 0.025
    max_hedges_per_window: 5
    fresh_start_only: true
    net_session_sizing: true
    smart_sizing: true
    min_profit_cents: 1
    max_contracts: 500

  # Minutes after each window opens that the bot is allowed to place its bet.
  entry_start_min: 7
  entry_end_min: 15

  # Price range (cents, 1-99) the bot will accept for whichever side it picks.
  max_price_cents: 75
  min_price_cents: 50

  # How long to leave the limit order resting before giving up (seconds).
  order_timeout_sec: 600

  # --- Short-term momentum filter ---
  momentum_filter:
    enabled: false
    lookback_sec: 30

  # --- Chop filter ---
  chop_filter:
    enabled: false
    lookback: 4
    max_alternations: 3

# --- Position sizing / Martingale ---
sizing:
  # "contracts" | "dollars" | "recovery" | "dalembert" | "dalembert_reverse" | "anti_martingale"
  mode: "dalembert"

  base_size: 1
  martingale_multiplier: 2
  max_martingale_steps: 10
  max_anti_martingale_steps: 10
  max_stake: 500

  # Only used when sizing.mode: "dalembert" - contract count moves by this
  # many contracts at a time: +1 unit after a loss, -1 unit after a win
  # (floored at base_size, capped at max_stake). Much gentler than
  # martingale's doubling, but a single win doesn't guarantee recovering
  # the whole deficit the way martingale/recovery sizing do.
  dalembert_unit: 1

  # Only used when sizing.mode: "dalembert_reverse" - the mirror image of
  # classic dalembert above: +1 unit after a WIN, -1 unit after a LOSS
  # (floored at dalembert_unit, capped at max_stake) - shares the same
  # dalembert_unit setting, only the step direction is reversed. On top of
  # that stepping, a running net-PnL counter can force an early reset back
  # to a fresh start (base_size, counter zeroed):
  #   profit_lock_cents - once the counter reaches this much profit, lock
  #     it in and reset instead of letting the stake climb indefinitely.
  #   loss_floor_cents  - once the counter drops to this much loss, cut the
  #     losing run short and reset instead of grinding the stake down.
  # Either set to 0 disables that check (stake just steps up/down forever
  # between dalembert_unit and max_stake).
  dalembert_reverse:
    profit_lock_cents: 0
    loss_floor_cents: 0

  # Only used when sizing.mode: "anti_martingale" - the mirror image of
  # every mode above: instead of growing the stake after a LOSS (to chase
  # recovery), this grows it after a WIN (to press a winning streak), and
  # resets straight back to base_size the instant a bet loses. Same
  # circuit-breaker idea as max_martingale_steps above, mirrored for win
  # streaks: max_anti_martingale_steps caps how many consecutive wins the
  # stake is allowed to grow through before forcing a reset to base_size
  # anyway - a safety net for a hot streak, independent of max_stake.
  anti_martingale:
    # "plus"       - stake increases by +unit after each win.
    # "multiplier" - stake is multiplied by `multiplier` after each win.
    variant: "plus"
    unit: 1
    multiplier: 2

  # Kalshi charges a small fee per contract at purchase time.
  fee_per_contract_cents: 2

# --- Recovery mode settings (only used when sizing.mode: "recovery") ---
recovery:
  min_profit_cents: 10
  max_contracts: 500
  max_price_cents: 75
  min_price_cents: 50
  max_cumulative_loss_cents: 50000

# --- Live tick recording ---
# Permanent, strategy-independent background logger (data_logger.py):
# writes one JSON line per second with BTC spot (CF Benchmarks), this
# window's Kalshi strike, and live UP/DOWN prices - regardless of
# strategy.mode or whether any bet is placed. Pure data collection for
# future backtesting; never affects trading decisions. Set enabled: false
# to turn it off entirely.
live_tick:
  enabled: true
  interval_sec: 1
  file: "./data/live_ticks.jsonl"
  # If true (default), a new file is created for every 15-minute market
  # window, named with that window's start time (e.g.
  # "./live_ticks_20260822_1430.jsonl") - instead of one ever-growing file
  # across the whole time the bot runs. Set to false to restore the old
  # single-shared-file behavior.
  new_file_per_session: true

# --- Runtime ---
runtime:
  dry_run: true
  poll_interval_sec: 5
  result_wait_timeout_sec: 600
  state_file: "./bot_state.json"
  log_file: "./bot.log"
