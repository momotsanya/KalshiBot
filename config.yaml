# ============================================================
# Kalshi BTC 15-Min Bot - Configuration
# ============================================================

# --- Authentication ---
# Kalshi requires a Key ID + RSA private key (NOT a plain token).
# Create both at https://kalshi.com/account/api  (or the demo site for testing)
kalshi:
  key_id: "YOUR_KEY_ID_HERE"
  private_key_path: "./kalshi_private_key.pem"

  # Use the demo environment first to prove the bot works before risking money.
  # IMPORTANT: demo is a SEPARATE paper-trading exchange with its own order
  # book - it does NOT mirror live production prices. Prices you see on
  # kalshi.com (the real site) will often differ from, or be thin/empty on,
  # demo. Only use demo to confirm the bot's logic/flow works, not to check
  # real prices.
  #
  # demo:       https://demo-api.kalshi.co/trade-api/v2
  # production: https://api.elections.kalshi.com/trade-api/v2   (recommended host, despite the name - serves ALL markets, not just elections)
  base_url: "https://api.elections.kalshi.com/trade-api/v2"

# --- Market ---
market:
  # Series ticker for the BTC up/down 15-minute market.
  # NOTE: Kalshi renames/rotates series tickers sometimes - if the bot can't
  # find markets, log into kalshi.com, open a BTC 15-min market, and confirm
  # this still matches the series ticker shown in the URL / market details.
  series_ticker: "KXBTC15M"

# --- Strategy ---
strategy:
  # "momentum"    = bet the SAME side that won the previous 15-min window
  # "reversal"    = bet the OPPOSITE side of the previous winner
  # "adaptive"    = win-stay/lose-shift: after a winning bet, use momentum;
  #                 after a losing bet, use reversal.
  # "price_trend" = bet based on the actual BTC/USD price move over the last
  #                 few cycles (see price_trend block below), not on which
  #                 side won past windows. Skips the window if the price
  #                 hasn't moved enough in either direction.
  # "spot_lean"   = bet based on where the LIVE BTC/USD spot price currently
  #                 stands relative to this window's own target (floor_strike):
  #                 spot above target -> UP, spot below target -> DOWN.
  #                 Checked live throughout the entry window (see spot_lean
  #                 block below), not decided once at window-open - uses an
  #                 external exchange price feed since Kalshi itself doesn't
  #                 expose a live intra-window BTC price.
  mode: "momentum"

  # Only used when mode is "adaptive" - which mode to use for the very first
  # bet, before there's any bet history to adapt from.
  adaptive_default_mode: "momentum"

  # --- Price-trend strategy settings (only used when mode: "price_trend") ---
  # Uses each window's own floor_strike (the BTC price it opened against -
  # already present on Kalshi's market record, no external price feed
  # needed) to measure how far BTC has moved over the last N cycles.
  price_trend:
    lookback_cycles: 6     # how many 15-min cycles back to measure from (try 4-8)
    threshold_pct: 0.15    # minimum % move required to bet; smaller moves are skipped (no bet)

  # --- Spot-lean strategy settings (only used when mode: "spot_lean") ---
  spot_lean:
    # Minimum % gap between live spot price and the window's target required
    # before picking a side. 0.0 = literal "higher than target -> UP, lower
    # -> DOWN", any nonzero gap decides a side. Raise this if you want to
    # skip windows where BTC is sitting almost exactly on the target.
    threshold_pct: 0.0

    # How often (seconds) to check the live BTC spot price - both for the
    # initial entry decision and for the hedge monitor below. Kept separate
    # from runtime.poll_interval_sec (which governs order-book/settlement
    # polling everywhere else) since spot price fetches are cheap external
    # API calls and checking more frequently helps catch crossings faster.
    poll_interval_sec: 1

    # After the initial bet, keep watching the live BTC price for the REST of
    # this 15-min window. If it crosses back to the opposite side of the
    # target, place an opposing bet of the SAME contract count as the first
    # bet (still capped by strategy.max_price_cents) - effectively hedging if
    # BTC reverses direction mid-window.
    hedge:
      enabled: false          # on/off switch for this whole feature
      threshold_pct: 0.0      # min % gap beyond target required to trigger the hedge; 0 = any crossing
      max_hedges_per_window: 1  # safety cap on how many opposite hedge orders can fire in one window

      # If true (default), hedges only follow a main bet with count == 1 (a
      # "fresh start" - not a recovery-scaled bet). If the main bet's count
      # was already > 1 (e.g. sizing.mode="recovery" mid-streak), hedging is
      # skipped entirely for that session. This keeps hedging and
      # recovery-mode sizing from compounding into a single, harder-to-reason
      # -about position. Set false to allow hedging regardless of main bet size.
      fresh_start_only: true

      # When a hedge fires, a window ends up with TWO bets instead of one -
      # e.g. a losing DOWN bet and a winning UP hedge. This controls how the
      # martingale/recovery sizing state reacts to that:
      #   true  (default) -> evaluate the NET combined outcome of all bets in
      #         that window before updating cumulative_loss/current_stake. A
      #         session that nets negative overall is treated as a loss (and
      #         sized for recovery) even if the LAST individual bet happened
      #         to win - which is usually what you actually want.
      #   false -> each bet updates the sizing state independently and
      #         immediately, in the order it settles (the naive behavior -
      #         a session can end net-negative but still reset to "fresh
      #         start" if its last-scored bet was a win).
      net_session_sizing: true

      # How each hedge order's SIZE is determined:
      #   false (default) -> hedge uses the SAME contract count as whatever
      #         bet started this session. Simple, but if BTC crosses back and
      #         forth more than once, the side that ultimately wins isn't
      #         guaranteed to cover what was spent on the other side.
      #   true  -> each hedge is sized so that IF this side wins, its payout
      #         (combined with any contracts already held on this same side
      #         this session) covers everything already spent on the OTHER
      #         side, plus min_profit_cents below. This is the same
      #         recovery-style sizing used elsewhere in the bot, applied per
      #         hedge - it does NOT try to equalize contract counts between
      #         sides, just guarantee that whichever side wins next comes out
      #         ahead given what's already been spent. Only fires once the
      #         current price makes that achievable within max_contracts;
      #         otherwise keeps waiting for a better price, same as a normal
      #         entry, up until the window closes.
      smart_sizing: false

      # Only used when smart_sizing: true. Minimum profit (cents) required -
      # IF the side being hedged wins - before a smart hedge will actually
      # fire. 0 = just break even; keep waiting for a better price otherwise.
      min_profit_cents: 1

      # Only used when smart_sizing: true. Safety cap: if the count needed
      # exceeds this, the bot keeps waiting for a cheaper price rather than
      # buy an oversized position (same reasoning as recovery.max_contracts).
      max_contracts: 50

  # Minutes after each window opens that the bot is allowed to place its bet.
  # e.g. entry_start_min=1, entry_end_min=3 -> bot places the order sometime
  # between minute 1 and minute 3 of the 15-minute window.
  entry_start_min: 1.0
  entry_end_min: 3.0

  # Maximum price (cents, 1-99) you're willing to pay for whichever side
  # (YES/UP or NO/DOWN) the strategy selects. During the entry window the
  # bot polls the live ask price for that side; it only places a bet once
  # the price is AT OR BELOW this threshold. If the price never drops to
  # this level before entry_end_min, the window is skipped - no bet.
  max_price_cents: 55

  # Minimum price (cents, 1-99) you're willing to pay. A very cheap price on
  # your chosen side usually means the market itself is leaning strongly
  # against that outcome - i.e. disagreeing with the bot's call - so a bet
  # only qualifies once price is between min_price_cents and max_price_cents.
  # Set to 1 for no effective floor (any price down to essentially free
  # still qualifies).
  min_price_cents: 1

  # How long to leave the limit order resting before giving up on it (seconds).
  # If unfilled after this, the order is cancelled and the window is skipped.
  order_timeout_sec: 60

  # --- Short-term momentum filter ---
  # A safety gate applied on top of WHATEVER strategy mode is active (not
  # specific to price_trend/spot_lean). Continuously checks live BTC spot
  # price direction over a short rolling window throughout the entire entry
  # period (entry_start_min-entry_end_min). If BTC has clearly been trending
  # DOWN over that window, UP orders are blocked (only DOWN allowed), and
  # vice versa - regardless of which side the strategy itself picked. If
  # there's no clear trend yet (insufficient data, or price is flat), it
  # does NOT block - only a genuine, currently-active short-term trend
  # against the chosen side prevents the order.
  momentum_filter:
    enabled: false      # off by default - opt in per your own risk preference
    lookback_sec: 30    # rolling window (seconds) used to judge "recent" direction

  # --- Chop filter ---
  # Skips betting when recent windows have been whipsawing (alternating
  # UP/DOWN) instead of trending - the exact regime where a momentum signal
  # loses repeatedly and martingale sizing hurts most.
  chop_filter:
    enabled: true
    lookback: 4            # look at the last N settled windows
    max_alternations: 3    # skip if this many direction-flips occur within that lookback (3 = every window flipped)

# --- Position sizing / Martingale ---
sizing:
  # "contracts" -> base_size is a number of contracts, sized by classic
  #                martingale (fixed price ceiling, doubles contract count
  #                after each loss)
  # "dollars"   -> base_size is a dollar amount; contract count is derived
  #                from limit_price_cents
  # "recovery"  -> price-aware martingale: after a loss, computes BOTH the
  #                price ceiling and contract count needed so that a single
  #                win fully recovers all accumulated losses (incl. fees)
  #                plus a minimum profit - instead of blindly doubling a
  #                fixed contract count at a fixed price. See `recovery:`
  #                block below. At the start and after each win, bets
  #                base_size contracts at max_price_cents, same as always.
  mode: "contracts"

  base_size: 1          # base bet at the start of a win streak / fresh start
  martingale_multiplier: 2.0   # multiply stake by this after a loss (mode: "contracts"/"dollars" only)
  max_martingale_steps: 6      # hard cap on consecutive doublings (mode: "contracts"/"dollars" only)
  max_stake: 200               # absolute cap on a single bet (mode: "contracts"/"dollars" only)

  # Kalshi charges a small fee per contract at purchase time. This is charged
  # in addition to the contract's price, and matters a lot for recovery math
  # (it's why recovering a loss needs slightly MORE than just "price where
  # profit = 0"). Simplified as a flat per-contract amount here - Kalshi's
  # real fee formula is a non-linear function of price and isn't exactly
  # flat, so treat this as an approximation and adjust if your actual fills
  # show a different per-contract cost.
  fee_per_contract_cents: 2

# --- Recovery mode settings (only used when sizing.mode: "recovery") ---
recovery:
  # Minimum guaranteed profit (cents, on top of fully recovering the loss)
  # required before the bot will place a recovery bet. 0 = just break even.
  min_profit_cents: 1

  # Safety cap: if recovering the current cumulative loss at the live price
  # would require more contracts than this, the bot keeps waiting (won't
  # place the bet) rather than buy an oversized position. If the entry
  # window closes with no qualifying (price, size) found, the loss carries
  # over and another recovery attempt is made next window.
  max_contracts: 50

  # Hard price ceiling for recovery bets. Even if the contract count needed
  # is within max_contracts above, the bot will NOT bet above this price -
  # a high price means a thin margin per contract, so recovering the same
  # loss needs many more contracts (more real money at risk, and a much
  # worse loss if this bet ALSO loses). Defaults to strategy.max_price_cents
  # if not set. Lower this if you want recovery bets held to a tighter,
  # safer price range than your normal entries.
  max_price_cents: 70

  # Price floor for recovery bets, same reasoning as strategy.min_price_cents -
  # a very cheap price usually means the market disagrees with this side.
  # Defaults to strategy.min_price_cents if not set.
  min_price_cents: 1

  # Circuit breaker: if the cumulative loss being chased grows past this
  # (cents) - e.g. because the market never offers a price good enough to
  # recover within max_contracts/max_price_cents - the bot gives up on
  # recovering that streak, eats the loss, and resets to a fresh start
  # rather than let the unrecovered amount grow indefinitely.
  max_cumulative_loss_cents: 2000

# --- Runtime ---
runtime:
  dry_run: true          # true = simulate everything, place NO real orders
  poll_interval_sec: 5
  # How long (seconds) to keep polling for the previous window's settlement
  # result before giving up on this window's bet. Settlement is usually fast
  # (seconds), but this is a safety cap. Defaults to entry_end_min*60 if unset.
  result_wait_timeout_sec: 120
  state_file: "./bot_state.json"
  log_file: "./bot.log"
