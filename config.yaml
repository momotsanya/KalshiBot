# V1.9
# ============================================================
# Kalshi BTC 15-Min Bot - Configuration
# Generated by the Config GUI
# ============================================================

# --- Authentication ---
kalshi:
  key_id: "YOUR_KEY_ID_HERE"
  private_key_path: "./kalshi_private_key.pem"

  # Use the demo environment first to prove the bot works before risking money.
  # IMPORTANT: demo is a SEPARATE paper-trading exchange with its own order
  # book - it does NOT mirror live production prices.
  #
  # demo:       https://external-api.demo.kalshi.co/trade-api/v2
  # production: https://external-api.kalshi.com/trade-api/v2
  base_url: https://external-api.kalshi.com/trade-api/v2

# --- Market ---
market:
  series_ticker: "KXBTC15M"


# --- Strategy ---
strategy:
  mode: "late_fade"  # "momentum" | "reversal" | "adaptive" | "price_trend" | "spot_lean" | "late_fade"
  adaptive_default_mode: "momentum"

  price_trend:
    lookback_cycles: 6
    threshold_pct: 0.15

  spot_lean:
    threshold_pct: 0.02
    poll_interval_sec: 1

  # --- Late-fade strategy settings (only used when mode: "late_fade") ---
  # Bets on a REVERSAL back toward this window's own target (floor_strike).
  # Only triggers if the absolute gap between spot and target is WITHIN 
  # the min_threshold_pct and max_threshold_pct range.
  # (Set max_threshold_pct to 0 for no upper limit).
  late_fade:
    min_threshold_pct: 0
    max_threshold_pct: 0.03

  # --- Hedge & Take-Profit (Top-level, independent of strategy.mode) ---
  hedge:
    enabled: false
    threshold_pct: 0.025
    max_hedges_per_window: 5
    fresh_start_only: true
    net_session_sizing: true
    smart_sizing: true
    min_profit_cents: 1
    max_contracts: 500

  take_profit:
    enabled: false
    threshold_pct: 0.025
    time_start_min: 10
    time_end_min: 14
    min_price_cents: 10
    max_price_cents: 90
    min_profit_cents: 1
    fresh_start_only: true

  # --- General Settings ---
  entry_start_min: 13
  entry_end_min: 15
  max_price_cents: 50
  min_price_cents: 15
  order_timeout_sec: 600

  momentum_filter:
    enabled: false
    lookback_sec: 30

  chop_filter:
    enabled: false
    lookback: 4
    max_alternations: 3

# --- Position sizing / Martingale ---
sizing:
  mode: "contracts"              # "contracts" | "dollars" | "recovery" | "dalembert" | "dalembert_reverse" | "anti_martingale"
  base_size: 1
  max_stake: 5000
  fee_per_contract_cents: 2

  # --- Recovery mode settings "contracts" classic Martingale---
  max_martingale_steps: 100
  martingale_variant: "plus"
  martingale_multiplier: 2
  martingale_unit: 1

  # --- Recovery mode settings "anti_martingale"---
  max_anti_martingale_steps: 10
  anti_martingale:
    variant: "plus"
    unit: 1
    multiplier: 2

  # --- Settings shared by BOTH "dalembert" and "dalembert_reverse" ---
  dalembert_unit: 1
  # Optional safety net for either dalembert variant, driven by the running
  # NET PnL since the last reset (state.py's dalembert_pnl_cents):
  #   profit_lock_cents - once that counter reaches this much profit, lock
  #     it in and reset to a fresh start instead of riding a hot streak
  #     (dalembert) or letting the stake climb indefinitely (dalembert_reverse).
  #   loss_floor_cents  - once it drops this much into the red, cut the
  #     losing run short and reset instead of grinding on.
  # Either set to 0 disables that check. Applies to whichever of the two
  # variants sizing.mode is currently set to - not a per-variant setting.
  profit_lock_cents: 0
  loss_floor_cents: 0

# --- Recovery mode settings "recovery"---
recovery:
  min_profit_cents: 10
  max_contracts: 5000
  max_price_cents: 50
  min_price_cents: 5
  max_cumulative_loss_cents: 500000

# --- Live tick recording ---
live_tick:
  enabled: false
  interval_sec: 1
  file: "./data/live_ticks.jsonl"
  new_file_per_session: true

# --- Runtime ---
runtime:
  dry_run: true
  poll_interval_sec: 5
  result_wait_timeout_sec: 600
  state_file: "./bot_state.json"
  log_file: "./bot.log"
